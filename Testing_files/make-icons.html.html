<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>NSR icon generator</title>
  </head>
  <body style="font-family: sans-serif; padding: 20px; background: #0f172a; color: #f1f5f9">
    <h3>NSR icon generator</h3>
    <p>
      Click the button. Four PNG files will download. Move them into
      <code>icons/</code> inside your extension folder. If the browser asks,
      allow multiple downloads.
    </p>
    <button id="go" style="padding: 8px 16px; font-size: 15px">Generate icons</button>
    <div id="preview" style="margin-top: 20px; display: flex; gap: 12px; align-items: end"></div>

    <script>
      function draw(size) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");
        const s = size;

        // Shield shape
        g.beginPath();
        g.moveTo(s * 0.5, s * 0.06);
        g.lineTo(s * 0.88, s * 0.2);
        g.lineTo(s * 0.88, s * 0.5);
        g.quadraticCurveTo(s * 0.88, s * 0.8, s * 0.5, s * 0.95);
        g.quadraticCurveTo(s * 0.12, s * 0.8, s * 0.12, s * 0.5);
        g.lineTo(s * 0.12, s * 0.2);
        g.closePath();

        // Blue to violet gradient fill
        const grad = g.createLinearGradient(0, 0, s, s);
        grad.addColorStop(0, "#3b82f6");
        grad.addColorStop(1, "#8b5cf6");
        g.fillStyle = grad;
        g.fill();

        g.lineWidth = Math.max(1, s * 0.04);
        g.strokeStyle = "rgba(255, 255, 255, 0.55)";
        g.stroke();

        // Check mark
        g.beginPath();
        g.moveTo(s * 0.32, s * 0.5);
        g.lineTo(s * 0.45, s * 0.64);
        g.lineTo(s * 0.7, s * 0.36);
        g.lineWidth = s * 0.09;
        g.lineCap = "round";
        g.lineJoin = "round";
        g.strokeStyle = "#ffffff";
        g.stroke();

        return c;
      }

      document.getElementById("go").onclick = () => {
        const preview = document.getElementById("preview");
        preview.replaceChildren();

        [16, 32, 48, 128].forEach((size, i) => {
          const canvas = draw(size);
          preview.appendChild(canvas);

          setTimeout(() => {
            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = `icon${size}.png`;
            a.click();
          }, i * 400);
        });
      };
    </script>
  </body>
</html>
